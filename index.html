<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellyfin Banner Studio</title>
<meta name="description" content="Design custom Jellyfin library banners in your browser — colours, fonts, patterns, silhouettes, emoji and your own background images — then export PNGs ready to upload to your server.">
<style>
  .jbs * { box-sizing: border-box; }
  body { margin: 0; }
  .jbs {
    --bg:#0b0c12; --panel:#12141d; --panel2:#181b26; --line:#252a38; --line2:#31374a;
    --txt:#e7e9f0; --dim:#8b93a8; --accent:#8b5cf6; --accent-l:#a78bfa; --ok:#34d399;
    text-align:left; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    min-height:100vh; padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .jbs h1, .jbs h2, .jbs p { margin:0; font-weight:inherit; }

  .jbs .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .jbs .brand { display:flex; align-items:center; gap:11px; }
  .jbs .logo {
    width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:17px;
    background:linear-gradient(145deg,#7c3aed,#4c1d95); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,.35);
  }
  .jbs .brand h1 { font-size:15px; font-weight:700; letter-spacing:.01em; }
  .jbs .brand p { font-size:11.5px; color:var(--dim); margin-top:1px; }
  .jbs .topactions { display:flex; gap:7px; align-items:center; }

  .jbs .layout { display:grid; grid-template-columns:minmax(330px,380px) minmax(0,1fr); gap:16px; align-items:start; }

  .jbs .panel {
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
    max-height:calc(100vh - 120px); overflow-y:auto; overscroll-behavior:contain;
  }
  .jbs .stage { position:sticky; top:14px; display:flex; flex-direction:column; gap:9px; }
  .jbs .stage-inner { position:relative; background:#05060a; border:1px solid var(--line); border-radius:14px; padding:10px; box-shadow:0 18px 50px rgba(0,0,0,.45); max-width:1180px; width:100%; align-self:center; }
  .jbs #bannerCanvas { display:block; width:100%; height:auto; border-radius:8px; }
  .jbs .stage-note { font-size:11px; color:var(--dim); text-align:center; }

  /* sections */
  .jbs .sec { border-top:1px solid var(--line); padding:2px 0 8px; }
  .jbs .sec:first-child { border-top:none; }
  .jbs .sec-head {
    width:100%; background:none; border:none; color:var(--txt); font:inherit; font-size:12.5px; font-weight:650;
    letter-spacing:.03em; text-transform:uppercase; padding:11px 2px 6px; display:flex; justify-content:space-between;
    align-items:center; cursor:pointer; opacity:.92;
  }
  .jbs .sec-head:hover { color:var(--accent-l); }
  .jbs .chev { color:var(--dim); font-size:11px; transition:transform .16s; }
  .jbs .sec.closed .chev { transform:rotate(-90deg); }
  .jbs .sec.closed .sec-body, .jbs .sec.closed .sec-sub { display:none; }
  .jbs .sec-sub { font-size:11px; color:var(--dim); margin:0 2px 8px; line-height:1.45; }
  .jbs .sec-body { display:flex; flex-direction:column; gap:9px; padding:2px 2px 2px; }
  .jbs .row { display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:end; }
  .jbs .row > .field:only-child { grid-column:span 2; }
  .jbs .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .jbs .lbl { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .jbs .hint { font-size:10.5px; color:var(--dim); line-height:1.45; }
  .jbs .dim { color:var(--dim); }
  .jbs .tiny { font-size:10.5px; }

  /* inputs */
  .jbs .txt, .jbs .sel {
    background:var(--panel2); border:1px solid var(--line2); color:var(--txt); border-radius:8px;
    padding:7px 9px; font-size:12.5px; width:100%; font-family:inherit;
  }
  .jbs textarea.txt { resize:vertical; min-height:44px; line-height:1.4; }
  .jbs .txt:focus, .jbs .sel:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,92,246,.16); }
  .jbs .range-row { display:flex; align-items:center; gap:9px; }
  .jbs input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:20px; }
  .jbs .rval { font-size:11px; color:var(--accent-l); font-family:ui-monospace,Menlo,Consolas,monospace; min-width:46px; text-align:right; }

  .jbs .seg { display:flex; gap:3px; background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:3px; }
  .jbs .seg-btn { flex:1; background:none; border:none; color:var(--dim); font:inherit; font-size:11px; padding:5px 4px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .jbs .seg-btn:hover { color:var(--txt); }
  .jbs .seg-btn.on { background:var(--accent); color:#fff; }

  .jbs .toggle {
    background:var(--panel2); border:1px solid var(--line2); color:var(--dim); border-radius:8px;
    padding:7px 12px; font-size:11.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .jbs .toggle:hover { color:var(--txt); border-color:var(--line2); }
  .jbs .toggle.on { background:rgba(139,92,246,.16); border-color:var(--accent); color:var(--accent-l); }

  .jbs .color-row { display:flex; align-items:center; gap:7px; }
  .jbs .swatch { position:relative; width:34px; height:34px; border-radius:8px; border:1px solid var(--line2); overflow:hidden; flex:none; }
  .jbs .swatch-inner { position:absolute; inset:0; }
  .jbs .swatch .pick { position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); opacity:0; cursor:pointer; border:none; padding:0; }
  .jbs .hex { flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line2); color:var(--txt); border-radius:8px; padding:7px 9px; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .jbs .hex:focus { outline:none; border-color:var(--accent); }
  .jbs .hex.bad { border-color:#e5484d; }

  /* library grid */
  .jbs .libgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; }
  .jbs .libbtn {
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; cursor:pointer;
    background:var(--panel2); border:1px solid var(--line2); border-radius:9px; color:var(--dim);
    font-family:inherit; font-size:10.5px; line-height:1.2; transition:border-color .12s, color .12s;
  }
  .jbs .libbtn:hover { color:var(--txt); border-color:var(--line2); }
  .jbs .libbtn.on { border-color:var(--accent); color:var(--accent-l); background:rgba(139,92,246,.12); }
  .jbs .iconcv { display:block; }
  .jbs .iconcv.sm { width:30px; height:30px; }

  /* font picker */
  .jbs .fontwrap { display:flex; flex-direction:column; gap:6px; }
  .jbs .fontsel {
    background:var(--panel2); border:1px solid var(--line2); color:var(--txt); border-radius:8px;
    padding:8px 10px; font-size:17px; text-align:left; cursor:pointer; position:relative;
  }
  .jbs .fontsel::after { content:"▾"; position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--dim); }
  .jbs .fontdrop { display:none; flex-direction:column; gap:7px; background:var(--panel2); border:1px solid var(--line2); border-radius:9px; padding:8px; }
  .jbs .fontdrop.open { display:flex; }
  .jbs .fontlist { max-height:230px; overflow-y:auto; display:flex; flex-direction:column; }
  .jbs .fontopt { background:none; border:none; color:var(--txt); font-size:17px; text-align:left; padding:7px 8px; border-radius:6px; cursor:pointer; }
  .jbs .fontopt:hover { background:rgba(139,92,246,.14); }
  .jbs .fontopt.on { color:var(--accent-l); background:rgba(139,92,246,.18); }

  /* emoji */
  .jbs .emojitrigwrap { display:flex; flex-direction:column; gap:7px; }
  .jbs .emojitrig {
    display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid var(--line2);
    color:var(--txt); border-radius:8px; padding:7px 10px; cursor:pointer; font-family:inherit; font-size:12.5px; text-align:left;
  }
  .jbs .emojitrig .chev { margin-left:auto; }
  .jbs .emojitrig-img { width:24px; height:24px; object-fit:contain; }
  .jbs .emojinative { font-size:20px; line-height:1; }
  .jbs .emojilabel { color:var(--txt); }
  .jbs .emojipanel { display:none; flex-direction:column; gap:7px; background:var(--panel2); border:1px solid var(--line2); border-radius:9px; padding:8px; }
  .jbs .emojipanel.open { display:flex; }
  .jbs .emojitop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .jbs .emojicats { display:flex; flex-wrap:wrap; gap:4px; }
  .jbs .catbtn { background:var(--panel); border:1px solid var(--line2); color:var(--dim); border-radius:6px; padding:3px 8px; font-size:10px; cursor:pointer; font-family:inherit; }
  .jbs .catbtn.on, .jbs .catbtn:hover { border-color:var(--accent); color:var(--accent-l); }
  .jbs .emojigrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:3px; max-height:200px; overflow-y:auto; }
  .jbs .emojiitem { display:grid; place-items:center; padding:5px; background:none; border:1px solid transparent; border-radius:7px; cursor:pointer; }
  .jbs .emojiitem:hover { background:rgba(139,92,246,.14); }
  .jbs .emojiitem.on { border-color:var(--accent); background:rgba(139,92,246,.2); }

  /* icons */
  .jbs .icongrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:5px; }
  .jbs .iconbtn { display:grid; place-items:center; padding:5px; background:var(--panel2); border:1px solid var(--line2); border-radius:9px; cursor:pointer; }
  .jbs .iconbtn:hover { border-color:var(--line2); background:#1e2230; }
  .jbs .iconbtn.on { border-color:var(--accent); background:rgba(139,92,246,.16); }

  /* palettes */
  .jbs .palettes { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:5px; }
  .jbs .pal-btn {
    display:flex; align-items:center; gap:5px; background:var(--panel2); border:1px solid var(--line2);
    border-radius:8px; padding:5px 7px; cursor:pointer; color:var(--dim); font-family:inherit; font-size:10.5px;
  }
  .jbs .pal-btn:hover { color:var(--txt); border-color:var(--accent); }
  .jbs .pal-dot { width:11px; height:11px; border-radius:3px; border:1px solid rgba(255,255,255,.14); flex:none; }
  .jbs .pal-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* buttons */
  .jbs .btn { border:none; border-radius:9px; padding:9px 15px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .13s, border-color .13s; }
  .jbs .btn:disabled { opacity:.4; cursor:default; }
  .jbs .btn-primary { background:var(--accent); color:#fff; }
  .jbs .btn-primary:hover:not(:disabled) { background:#7c3aed; }
  .jbs .btn-accent { background:rgba(139,92,246,.14); color:var(--accent-l); border:1px solid var(--accent); }
  .jbs .btn-accent:hover { background:rgba(139,92,246,.24); }
  .jbs .btn-ghost { background:var(--panel2); color:var(--dim); border:1px solid var(--line2); }
  .jbs .btn-ghost:hover:not(:disabled) { color:var(--txt); }
  .jbs .btn.tiny { padding:6px 9px; font-size:11px; }
  .jbs .btnrow { display:flex; gap:7px; flex-wrap:wrap; }
  .jbs .btnrow .btn { flex:1; min-width:120px; }
  .jbs .bgrow { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .jbs .filein { display:none; }
  .jbs label.btn { display:inline-flex; align-items:center; }

  /* presets */
  .jbs .presetlist { display:flex; flex-direction:column; gap:4px; }
  .jbs .presetrow { display:flex; gap:5px; }
  .jbs .presetload { flex:1; text-align:left; background:var(--panel2); border:1px solid var(--line2); color:var(--txt); border-radius:8px; padding:7px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .jbs .presetload:hover { border-color:var(--accent); color:var(--accent-l); }

  /* click-to-edit feedback */
  .jbs .hitoutline { position:absolute; border:2px dashed var(--accent-l); border-radius:9px; pointer-events:none; opacity:0; transition:opacity .22s; box-shadow:0 0 22px rgba(139,92,246,.35) inset, 0 0 0 3px rgba(139,92,246,.18); }
  .jbs .hitoutline.show { opacity:1; }
  .jbs .hitchip { position:absolute; transform:translate(12px, -50%); background:#1b1f2b; border:1px solid var(--accent); color:var(--txt);
    font-size:11px; padding:4px 9px; border-radius:7px; pointer-events:none; opacity:0; transition:opacity .12s; white-space:nowrap; z-index:6; }
  .jbs .hitchip.show { opacity:1; }
  @keyframes jbsFieldFlash {
    0% { box-shadow:0 0 0 0 rgba(139,92,246,0); }
    18% { box-shadow:0 0 0 3px rgba(139,92,246,.55); }
    100% { box-shadow:0 0 0 0 rgba(139,92,246,0); }
  }
  .jbs .flash { animation:jbsFieldFlash 1.6s ease-out; border-radius:9px; }
  @keyframes jbsSecFlash {
    0% { background:rgba(139,92,246,0); }
    25% { background:rgba(139,92,246,.11); }
    100% { background:rgba(139,92,246,0); }
  }
  .jbs .sec.sec-flash { animation:jbsSecFlash 1.5s ease-out; }

  /* share-link dialog */
  .jbs .linkmodal { position:fixed; inset:0; background:rgba(4,5,9,.72); display:grid; place-items:center; z-index:10000; padding:18px; }
  .jbs .lm-box { background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:18px; max-width:520px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.6); text-align:left; }
  .jbs .lm-box h3 { font-size:15px; font-weight:700; margin-bottom:7px; }
  .jbs .lm-box p { font-size:12px; color:var(--dim); line-height:1.5; margin-bottom:12px; }
  .jbs .lm-row { display:flex; gap:7px; }
  .jbs .linkinput { flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line2); color:var(--txt); border-radius:9px; padding:9px 11px; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .jbs .lm-foot { display:flex; justify-content:flex-end; margin-top:12px; }

  /* toast */
  .jbs .toast {    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px);
    background:#1b1f2b; color:var(--txt); border:1px solid var(--line2); border-radius:10px;
    padding:10px 16px; font-size:12.5px; box-shadow:0 12px 34px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:9999; max-width:86vw; text-align:center;
  }
  .jbs .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .jbs .toast.bad { border-color:#e5484d; }

  .jbs ::-webkit-scrollbar { width:9px; height:9px; }
  .jbs ::-webkit-scrollbar-track { background:transparent; }
  .jbs ::-webkit-scrollbar-thumb { background:#333a4d; border-radius:5px; }
  .jbs ::-webkit-scrollbar-thumb:hover { background:#414a61; }

  @media (max-width:960px) {
    .jbs .layout { grid-template-columns:1fr; }
    .jbs .stage { position:static; order:-1; }
    .jbs .panel { max-height:none; }
  }
</style>
</head>
<body>
<div class="jbs">
  <header class="topbar">
    <div class="brand">
      <div class="logo">▶</div>
      <div>
        <h1>Jellyfin Banner Studio</h1>
        <p>Design custom library banners · export PNG · nothing leaves your browser</p>
      </div>
    </div>
    <div class="topactions">
      <button id="undoBtn" class="btn btn-ghost" title="Undo (Ctrl+Z)">↶</button>
      <button id="redoBtn" class="btn btn-ghost" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button id="headerRandomBtn" class="btn btn-ghost" title="Randomise everything">↻ Randomise</button>
      <button id="headerShareBtn" class="btn btn-ghost" title="Copy a link to this design">🔗 Share</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel" id="controls"></aside>
    <section class="stage">
      <div class="stage-inner"><canvas id="bannerCanvas" width="1536" height="1024"></canvas></div>
      <p class="stage-note">Click anything on the banner to edit it · Jellyfin → Dashboard → Libraries → ⋯ → Edit → upload the PNG</p>
    </section>
  </main>

  <div id="toast" class="toast"></div>
</div>

<script>

      defaultLibrary: { evaluateItem: "movies" },
      defaultAspect: { evaluateItem: "3:2" },
      appTitle: { evaluateItem: "Jellyfin Banner Studio" },
    };
</script>
